# Site settings
title: IAM OnDemand
description: Secure, Scalable Keycloak Hosting. Ready in Minutes. Simplify Identity and Access Management with our fully managed, turnkey Keycloak on demand solutions.
url: "" # Base hostname & protocol for your site (e.g., https://iamondemand.com)
baseurl: "" # Subpath of your site (e.g., /blog) - leave empty if hosted at root

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - CLAUDE.md
  - README.md
  - plan.md
  - research.md

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

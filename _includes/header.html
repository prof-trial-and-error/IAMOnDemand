<header class="site-header">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="{{ site.title }} - Home">
      <div class="logo-icon" style="background-image: url('{{ '/assets/images/sitegraphics/logo.png' | relative_url }}'); background-color: transparent;"></div>
      {{ site.title }}
    </a>
    
    <button class="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <nav id="main-nav" class="header-nav" role="navigation" aria-label="Main Navigation">
      {% for item in site.data.navigation.main %}
        {% if item.class contains 'btn' %}
          <a href="{{ item.url | relative_url }}" class="{{ item.class }}">{{ item.title }}</a>
        {% else %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endif %}
      {% endfor %}
      
      <!-- Dark mode toggle -->
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </nav>
  </div>
</header>

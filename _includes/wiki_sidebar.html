<nav class="wiki-nav" aria-label="Documentation navigation">
    <div class="wiki-nav-header">
        <a href="{{ '/wiki/' | relative_url }}" class="wiki-nav-home">
            <i class="fa fa-book"></i> Documentation
        </a>
    </div>

    {% for section in site.data.wiki_nav %}
    <div class="wiki-nav-section {% if page.url contains section.docs[0].url %}is-expanded{% endif %}">
        <button class="wiki-nav-section-title" aria-expanded="true">
            <span>{{ section.title }}</span>
            <i class="fa fa-chevron-down"></i>
        </button>
        <ul class="wiki-nav-list">
            {% for doc in section.docs %}
            <li class="wiki-nav-item">
                <a href="{{ doc.url | relative_url }}"
                   class="wiki-nav-link {% if page.url == doc.url %}is-active{% endif %}"
                   {% if page.url == doc.url %}aria-current="page"{% endif %}>
                    {{ doc.title }}
                </a>
                {% if doc.children %}
                <ul class="wiki-nav-sublist">
                    {% for child in doc.children %}
                    <li class="wiki-nav-subitem">
                        <a href="{{ child.url | relative_url }}"
                           class="wiki-nav-sublink {% if page.url == child.url %}is-active{% endif %}">
                            {{ child.title }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
</nav>

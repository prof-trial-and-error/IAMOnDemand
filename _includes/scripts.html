<!-- jQuery -->
<script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>

<!-- Typed.js for hero animation -->
<script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
<script type="text/javascript" src="{{ '/assets/js/animation.js' | relative_url }}"></script>

<!-- Dark mode toggle -->
<script>
function myFunction() {
    var element = document.body;
    element.classList.toggle("dark-mode");
}
</script>

<!-- Mobile menu -->
<script>
const navbarMenu = document.getElementById("menu");
const burgerMenu = document.getElementById("burger");
const headerMenu = document.getElementById("header");

burgerMenu.addEventListener("click", () => {
    burgerMenu.classList.toggle("is-active");
    navbarMenu.classList.toggle("is-active");

    if (navbarMenu.classList.contains("is-active")) {
        document.body.style.overflow = "hidden";
    } else {
        document.body.style.overflow = "initial";
    }
});

const removeMenu = () => {
    burgerMenu.classList.remove("is-active");
    navbarMenu.classList.remove("is-active");
    document.body.style.overflow = "initial";
};

document.querySelectorAll(".menu-link").forEach((link) => {
    link.addEventListener("click", removeMenu);
});

window.addEventListener(
    "scroll",
    (() => {
        let lastScrollPosition = 0;

        return () => {
            const currentScrollPosition = window.scrollY;

            if (currentScrollPosition > lastScrollPosition) {
                headerMenu.classList.add("is-sticky");
            } else {
                headerMenu.classList.remove("is-sticky");
            }

            lastScrollPosition = currentScrollPosition;
        };
    })()
);

window.addEventListener("resize", () => {
    if (window.innerWidth > 768) {
        if (navbarMenu.classList.contains("is-active")) {
            removeMenu();
        }
    }
});
</script>

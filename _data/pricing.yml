# -----------------------------------------------------------------------------
# FAQ SECTION
# -----------------------------------------------------------------------------
faq:
  title: "Frequently Asked Questions"
  subtitle: "Can't find what you're looking for? <a href='/funnel/b/'>Contact our team</a>."
  
  items:
    - question: "Do you charge per user?"
      answer: "No! Unlike most identity providers, we offer unlimited users on all paid plans. You pay a fixed monthly price regardless of how many users you have."
      
    - question: "Is there a free trial?"
      answer: "Yes! All plans come with a 7-day free trial with full access to features. No credit card required to start."
      
    - question: "Can I change plans later?"
      answer: "Absolutely. You can upgrade or downgrade at any time. Changes take effect immediately and we'll prorate the difference."
      
    - question: "What happens when my trial ends?"
      answer: "You'll have a 3-day grace period to choose a plan. We'll never delete your data without warning. If you don't subscribe, your instance will be suspended (not deleted) and can be reactivated anytime."
      
    - question: "Can I migrate from self-hosted Keycloak?"
      answer: "Yes! We provide free migration assistance on all plans. Most migrations complete within hours with minimal downtime."
      
    - question: "Where is my data stored?"
      answer: "By default, all data is stored in EU data centers (Germany). Professional and higher plans can choose from US and APAC regions as well."
      
    - question: "Do you offer discounts for startups or non-profits?"
      answer: "Yes! We offer 30% off for registered non-profits and 50% off for early-stage startups. Contact us to apply."
      
    - question: "What payment methods do you accept?"
      answer: "We accept all major credit cards via Stripe. Enterprise customers can also pay by invoice with NET 30 terms."


# =============================================================================
# PRICING PAGE DATA FOR JEKYLL
# =============================================================================
# File: _data/pricing.yml
# Purpose: Complete pricing page data for a Keycloak SaaS hosting service
# Usage: Access in templates via {{ site.data.pricing.* }}
# =============================================================================

# -----------------------------------------------------------------------------
# PAGE METADATA
# -----------------------------------------------------------------------------
page:
  title: "Simple, Transparent Pricing"
  subtitle: "Unlimited users on every plan. No per-user fees, ever."
  description: "Choose the plan that fits your needs. All plans include unlimited users, automatic updates, and EU hosting."
  
  # Badge/highlight text shown above title
  badge: "🚀 7-Day Free Trial – No Credit Card Required"
  
  # Toggle for annual/monthly pricing display
  billing_toggle:
    monthly_label: "Monthly"
    annual_label: "Annual"
    annual_discount_text: "Save 20%"
    default: "annual"  # which tab is active by default

# -----------------------------------------------------------------------------
# PRICING TIERS
# -----------------------------------------------------------------------------
tiers:
  # -------------------------
  # TIER 1: STARTER
  # -------------------------
  - id: "starter"
    name: "Starter"
    description: "Perfect for side projects, MVPs, and small teams getting started."
    
    # Pricing
    price_monthly: 29
    price_annual: 279          # Total annual price (not per month)
    price_annual_monthly: 23   # Annual price shown as per-month equivalent
    currency: "$"
    billing_period: "month"
    
    # Visual styling
    highlight: false           # Set true to add visual emphasis (border, shadow)
    popular: false             # Shows "Most Popular" badge
    recommended: false         # Shows "Recommended" badge
    cta_text: "Start Free Trial"
    cta_url: "/funnel/a/?plan=starter"
    cta_style: "secondary"     # primary, secondary, outline
    
    # Key features shown in tier card (keep to 5-7 max)
    key_features:
      - "Unlimited users"
      - "1 realm"
      - "5 applications"
      - "1 custom domain"
      - "Daily backups"
      - "99.5% uptime SLA"
      - "Email support (48h response)"
    
    # What's NOT included (shown with strikethrough or X icon)
    not_included:
      - "Custom extensions"
      - "Admin API access"
      - "Log access"
      - "Enterprise IdP connections"

  # -------------------------
  # TIER 2: PROFESSIONAL
  # -------------------------
  - id: "professional"
    name: "Professional"
    description: "For growing startups and SaaS companies ready to scale."
    
    # Pricing
    price_monthly: 99
    price_annual: 950
    price_annual_monthly: 79
    currency: "$"
    billing_period: "month"
    
    # Visual styling
    highlight: true
    popular: true
    recommended: false
    cta_text: "Start Free Trial"
    cta_url: "/funnel/a/?plan=professional"
    cta_style: "primary"
    
    # Key features shown in tier card
    key_features:
      - "Unlimited users"
      - "5 realms"
      - "25 applications"
      - "3 custom domains"
      - "Dedicated cluster"
      - "99.9% uptime SLA"
      - "Priority support (12h response)"
    
    not_included:
      - "Multi-region failover"
      - "Custom extension development"
      - "SIEM integration"

  # -------------------------
  # TIER 3: BUSINESS
  # -------------------------
  - id: "business"
    name: "Business"
    description: "For established companies with advanced security and compliance needs."
    
    # Pricing
    price_monthly: 299
    price_annual: 2870
    price_annual_monthly: 239
    currency: "$"
    billing_period: "month"
    
    # Visual styling
    highlight: false
    popular: false
    recommended: false
    cta_text: "Start Free Trial"
    cta_url: "/funnel/a/?plan=business"
    cta_style: "secondary"
    
    # Key features shown in tier card
    key_features:
      - "Unlimited users"
      - "Unlimited realms"
      - "Unlimited applications"
      - "10 custom domains"
      - "HA cluster with failover"
      - "99.95% uptime SLA"
      - "Dedicated Slack + 24/7 critical"
    
    not_included:
      - "Private cloud deployment"
      - "Custom SLA above 99.95%"
      - "Dedicated account manager"

  # -------------------------
  # TIER 4: ENTERPRISE
  # -------------------------
  - id: "enterprise"
    name: "Enterprise"
    description: "Custom solutions for large organizations with specific requirements."
    
    # Pricing - null values indicate "Contact Sales"
    price_monthly: null
    price_annual: null
    price_annual_monthly: null
    currency: "$"
    billing_period: "month"
    price_label: "Custom"      # Displayed instead of price
    
    # Visual styling
    highlight: false
    popular: false
    recommended: false
    cta_text: "Contact Sales"
    cta_url: "/funnel/b/"
    cta_style: "outline"
    
    # Key features shown in tier card
    key_features:
      - "Everything in Business, plus:"
      - "Private cloud or on-premise"
      - "Multi-region active-active"
      - "Custom SLA up to 99.99%"
      - "24/7 phone support"
      - "Dedicated account manager"
      - "Custom contract terms"
    
    not_included: []  # Enterprise includes everything


<h2 class="funnel-question">Book your consultation</h2>
<p class="funnel-subtitle">Fill in your details and we'll get back to you within one business day.</p>

<form class="funnel-form" data-action="FUNNEL_B_ENDPOINT" data-redirect="{{ '/funnel/b/thank-you/' | relative_url }}">
    <div class="funnel-hidden-fields"></div>

    <div class="funnel-form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required>
    </div>

    <div class="funnel-form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required>
    </div>

    <div class="funnel-form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="funnel-form-group">
        <label for="company">Company Name</label>
        <input type="text" id="company" name="company" required>
    </div>

    <div class="funnel-form-group">
        <label for="message">Message <span class="optional-label">(optional)</span></label>
        <textarea id="message" name="message" placeholder="Tell us about your project or any specific questions..."></textarea>
    </div>

    <button type="submit" class="funnel-submit-btn" data-original-text="Book a Call">Book a Call</button>
    <div class="funnel-form-error"></div>
    <p class="funnel-form-note">By submitting you agree to our <a href="{{ '/privacy-policy' | relative_url }}">Privacy Policy</a>.</p>
</form>
